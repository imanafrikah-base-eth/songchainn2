<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon & Manifest -->
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Preconnect: warm DNS + TLS before JS runs -->
    <link rel="preconnect" href="https://wsjhbfmzbonxmxaaassu.supabase.co" crossorigin />
    <link rel="preconnect" href="https://auth.farcaster.xyz" crossorigin />
    <link rel="dns-prefetch" href="https://wsjhbfmzbonxmxaaassu.supabase.co" />
    <link rel="dns-prefetch" href="https://auth.farcaster.xyz" />
    <!-- Basic SEO -->
    <title>$ONGCHAINN</title>
    <meta name="description" content="$ONGCHAINN. Stream music from artists worldwide, and own the songs you love. Artists publish direct and get paid direct, with nobody in between." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- Matches --background exactly. The status bar and browser chrome are
         part of the app surface; a colour that does not match is the fastest
         way to look like a website pretending to be an app. -->
    <meta name="theme-color" content="#101113" />
    <meta name="application-name" content="$ONGCHAINN" />
    <!-- iOS PWA: full-screen standalone mode, no browser chrome -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="$ongChainn" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Farcaster Mini App embed -->
    <meta name="fc:frame" content='{"version":"1","imageUrl":"https://songchainn.xyz/assets/splash.webp","button":{"title":"Open $ongChainn","action":{"type":"launch_frame","name":"$ongChainn","url":"https://songchainn.xyz","splashImageUrl":"https://songchainn.xyz/assets/splash.webp","splashBackgroundColor":"#101113"}}}' />

    <!-- Open Graph (Sharing Preview) -->
    <meta property="og:title" content="$ONGCHAINN" />
    <meta property="og:description" content="Stream music from artists worldwide, and own the songs you love. Artists publish direct and get paid direct, with nobody in between." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon-512.png" />
    <meta property="og:url" content="https://songchainn.xyz" />
    <meta property="og:site_name" content="$ONGCHAINN" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="$ONGCHAINN" />
    <meta name="twitter:description" content="Stream music from artists worldwide, and own the songs you love. Artists publish direct and get paid direct, with nobody in between." />
    <meta name="twitter:image" content="/icon-512.png" />
    <meta name="twitter:site" content="@songchainn" />

    <script>
      (function () {
        var isDevHost =
          location.hostname === "localhost" ||
          location.hostname === "127.0.0.1" ||
          location.hostname === "0.0.0.0" ||
          location.port === "5173";
        if (!isDevHost) return;
        if (!("serviceWorker" in navigator)) return;
        var key = "songchainn_dev_sw_reset_done";
        if (sessionStorage.getItem(key) === "done") return;
        sessionStorage.setItem(key, "done");

        window.addEventListener("load", function () {
          Promise.all([
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              if (!regs.length) return false;
              return Promise.all(regs.map(function (r) { return r.unregister(); })).then(function () { return true; });
            }),
            (typeof caches !== "undefined" && caches.keys ? caches.keys().then(function (keys) {
              if (!keys.length) return false;
              return Promise.all(keys.map(function (k) { return caches.delete(k); })).then(function () { return true; });
            }) : Promise.resolve(false))
          ]).catch(function () {});
        });
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
